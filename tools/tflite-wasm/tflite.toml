# The TensorFlow release the browser runtime is built from.
#
# One place, because it used to be two: build.sh carried a default and the CI
# tag carried a version, and nothing made them agree. This file is what both
# read now, and the workflow refuses a tag that names a different version.
#
# It has to match DESKTOP_VERSION in the wxscan package's tool/tflite.lock, or
# a browser runs a different runtime from every other platform. That package's
# tool/check_tflite_web.sh is what says so.
#
# Changing it here is the whole of a version bump; tagging tflite-<version>
# builds and publishes it.

[tensorflow]
version = "v2.17.1"
