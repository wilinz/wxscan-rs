# wxscan: the WeChat wechat_qrcode algorithm in Rust.
#
# This workspace holds the four crates that are specific to that algorithm and
# that have to move as one: the weights belong to the detector, the tflite
# binding is the backend it runs them on, and the C ABI is its surface. Nothing
# here is useful on its own.
#   wxscan      CNN detection, super resolution and orchestration, with tflite
#               inference enabled by default. The complete WeChat algorithm.
#   wxscan-tflite
#               The tflite binding, the default inference backend. Separate so
#               that the only C dependency is confined to it. The alternative,
#               tract, is pure Rust and needs no crate of its own.
#   wxscan-ffi  The C ABI, for callers outside Rust.
#   wxscan-wasm The same ABI as a WebAssembly module, for browsers. Not
#               published: its artifact is a .wasm file, not a crate.
#
# The two pieces that are *not* WeChat specific live in their own repositories,
# because they are useful to anyone:
#   cvlite      github.com/wilinz/cvlite   OpenCV imgproc functions
#   wxing       github.com/wilinz/wxing    the ZXing fork, QR decoding
#
# The weights are not here either, and are in no crate at all: they are data,
# and a registry is the wrong place to version two megabytes of it.
#   wxscan-weights  github.com/wilinz/wxscan-weights
[workspace]
resolver = "2"
members = [
    "crates/wxscan",
    "crates/wxscan-tflite",
    "crates/wxscan-ffi",
    "crates/wxscan-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wilinz/wxscan-rs"
rust-version = "1.75"

[profile.release]
opt-level = 3

# The browser build. `opt-level = 3` because the module runs a CNN and size is
# the lesser cost, but with debug information stripped and one codegen unit,
# which together take about two thirds off. Panics abort: unwinding tables are
# dead weight when no caller can catch a panic across the wasm boundary.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
strip = true
panic = "abort"
