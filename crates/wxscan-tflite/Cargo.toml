[package]
name = "wxscan-tflite"
description = "Minimal FFI binding to libtensorflowlite_c (the LiteRT C API), used as the default inference backend of wxscan"
keywords = ["tflite", "litert", "tensorflow", "inference", "ffi"]
categories = ["external-ffi-bindings", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
build = "build.rs"

[lib]
crate-type = ["rlib"]

[features]
# Link Google's LiteRT AAR for Android, which names the C API libLiteRt, in
# place of a libtensorflowlite_c built from the TensorFlow sources. Only the
# name on the link line differs; the API behind it is the same.
litert = []

[dependencies]
