[package]
name = "wxscan"
description = "Rust port of the wechat_qrcode algorithm from OpenCV contrib: CNN detector, super resolution and decoding, without OpenCV"
keywords = ["qrcode", "wechat", "scanner", "barcode", "tflite"]
categories = ["computer-vision", "multimedia::images"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
crate-type = ["rlib"]

[features]
# tflite is on by default: without the CNN models the pipeline is only a plain decoder
default = ["tflite"]
# Pulls in the tflite binding and implements net::Net for it
tflite = ["dep:wxscan-tflite", "wxscan-models?/tflite"]
# The pure Rust alternative: tract running the ONNX weights, no C dependency
tract = ["dep:tract-onnx", "wxscan-models?/onnx"]
# Instrumentation used by examples/profile
profiling = ["wxing/profiling"]
# Embeds the prebuilt weights from wxscan-models, exposed as the `models`
# module. The format follows the backend: enabling it alongside `tflite` gives
# `models::tflite`.
bundled-models = ["dep:wxscan-models"]

[dependencies]
cvlite = "0.1.0"
wxing = "0.1.0"
wxscan-models = { path = "../wxscan-models", version = "0.1.0", optional = true, default-features = false }
wxscan-tflite = { path = "../wxscan-tflite", version = "0.1.0", optional = true }
tract-onnx = { version = "0.21", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[example]]
name = "dump"
required-features = []

[[example]]
name = "dump_nn"
required-features = ["tflite"]

[[example]]
name = "bench"
required-features = ["tflite"]

[[example]]
name = "bench_bin"

[[example]]
name = "profile"
required-features = ["tflite", "profiling"]
