[package]
name = "wxscan-models"
description = "Prebuilt TFLite and ONNX weights for wxscan, converted from the Caffe models published by WeChatCV/opencv_3rdparty"
keywords = ["qrcode", "wechat", "onnx", "model", "weights"]
categories = ["computer-vision"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["src/**", "models/**", "NOTICE", "LICENSE", "README.md"]

[features]
# One feature per model format; a build embeds only the formats it enables.
default = ["tflite"]
tflite = []
onnx = []

[lib]
crate-type = ["rlib"]

[dependencies]
