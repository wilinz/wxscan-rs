language = "C"
header = "/* Generated by cbindgen from the wxscan-ffi crate. Do not edit. */"
include_guard = "WXSCAN_H"
pragma_once = true
cpp_compat = true
documentation_style = "doxy"
usize_is_size_t = true

[export]
prefix = ""
# The browser backend's entry points. `wxscan_host_*` are imports the wasm
# module asks its host for, not functions this library provides, and
# `wxscan_scanner_new_host` only exists in a wasm build; a C caller can call
# none of the three. Their contract is in src/host_net.rs.
exclude = ["wxscan_host_forward", "wxscan_host_fetch", "wxscan_scanner_new_host"]

[parse]
parse_deps = false
