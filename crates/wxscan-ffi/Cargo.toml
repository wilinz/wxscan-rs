[package]
name = "wxscan-ffi"
description = "C ABI for wxscan, for callers in C, C++, Swift, Kotlin, Python and others"
keywords = ["qrcode", "wechat", "ffi", "c-api", "scanner"]
categories = ["computer-vision", "external-ffi-bindings"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
# Test fixtures are dev-only: the SSD golden outputs and the image corpus are
# what a checkout runs `cargo test` against, not something a caller of this
# crate builds with. Excluding them matches cvlite and wxing.
exclude = ["tests/**"]
build = "build.rs"

[lib]
name = "wxscan_ffi"
# No cdylib: producing one links the TFLite symbols at build time, while this
# library expects the host build system to supply that library at the final
# link. A caller that wants a shared object wraps this crate in one of its own
# and provides the search path there.
crate-type = ["staticlib", "rlib"]

[features]
default = ["tflite", "image-io", "model-fs", "png", "jpeg", "gif"]
# The inference backends. Both may be on at once, in which case a model buffer
# is tried as TFLite and then as ONNX, so one binary takes either format.
tflite = ["wxscan/tflite"]
tract = ["wxscan/tract"]
# Inference by the host rather than by this library, for the wasm build: see
# the `host_net` module. Costs nothing in size, since it compiles no engine.
host-net = []
# Reading an encoded image at all, for `wxscan_scan_path` and
# `wxscan_scan_bytes`. The entry points and the format sniffing, not the
# decoders: which of those are compiled in is the one feature per format
# below, and this on its own reads nothing. Off is what the wasm build wants,
# having no filesystem, no need — a browser decodes pictures itself — and
# every kilobyte to answer for.
#
# HEIC, which is most of a photo library, is in none of them: it wants an HEVC
# decoder, which is not something to carry by accident.
# `wxscan_set_image_decoder` is the answer to that one, and the caller lends
# what its platform already has.
image-io = ["dep:image"]
# One feature per decoder, because a decoder nothing decodes is pure size and
# what "nothing" means is the caller's to say. The three in `default` are what
# a photo picker writes — iOS `image_picker` emits jpg, png or gif and nothing
# else — and together they are 436 KB, measured on the arm64 macOS shared
# library.
#
# The other three arrive from elsewhere rather than from a camera: webp off
# the web, bmp out of a Windows screenshot. They are 570 KB and off by
# default, because whether that is worth paying is a question about the
# platform — Apple's ImageIO reads all three already, and Windows, Linux and
# Android have nothing to fall back on. Previously this crate decided it, as a
# target dependency; a caller that cannot say otherwise is exactly what a
# build hook configured from a pubspec needs to say otherwise.
png = ["image-io", "image/png"]
jpeg = ["image-io", "image/jpeg"]
gif = ["image-io", "image/gif"]
webp = ["image-io", "image/webp"]
bmp = ["image-io", "image/bmp"]
tiff = ["image-io", "image/tiff"]
# Loading weights from a path, for `wxscan_scanner_new_path`. Only std::fs, so
# it costs a few hundred bytes rather than a decoder — but a browser has no
# filesystem to read, so the wasm build leaves it off with the rest of the
# defaults and does not carry a function that could only ever fail.
model-fs = []


[dependencies]
cvlite = "0.1.0"
wxscan = { path = "../wxscan", version = "0.1.0", default-features = false }
encoding_rs = "0.8"
# No format features here: they come from the per-format features above, so
# that a caller turning one off actually removes it rather than finding it
# switched on again from underneath.
image = { version = "0.25", default-features = false, optional = true }

[build-dependencies]
cbindgen = "0.27"
