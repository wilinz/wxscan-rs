[package]
name = "wxscan-ffi"
description = "C ABI for wxscan, for callers in C, C++, Swift, Kotlin, Python and others"
keywords = ["qrcode", "wechat", "ffi", "c-api", "scanner"]
categories = ["computer-vision", "external-ffi-bindings"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
# Test fixtures are dev-only: the SSD golden outputs and the image corpus are
# what a checkout runs `cargo test` against, not something a caller of this
# crate builds with. Excluding them matches cvlite and wxing.
exclude = ["tests/**"]
build = "build.rs"

[lib]
name = "wxscan_ffi"
# No cdylib: producing one links the TFLite symbols at build time, while this
# library expects the host build system to supply that library at the final
# link. A caller that wants a shared object wraps this crate in one of its own
# and provides the search path there.
crate-type = ["staticlib", "rlib"]

[features]
default = ["tflite", "image-io", "model-fs"]
# The inference backends. Both may be on at once, in which case a model buffer
# is tried as TFLite and then as ONNX, so one binary takes either format.
tflite = ["wxscan/tflite"]
tract = ["wxscan/tract"]
# Inference by the host rather than by this library, for the wasm build: see
# the `host_net` module. Costs nothing in size, since it compiles no engine.
host-net = []
# Reading an encoded image, for `wxscan_scan_path` and `wxscan_scan_bytes`.
# Costs 436 KB of decoders, measured on the arm64 macOS shared library, which
# is why it can be turned off; the wasm build does, having no filesystem, no
# need — a browser decodes pictures itself — and every kilobyte to answer for.
#
# The three are the ones a photo picker writes: iOS `image_picker` emits jpg,
# png or gif and nothing else. HEIC, which is most of a photo library, cannot be
# had here at any sensible price — it wants an HEVC decoder —
# `wxscan_set_image_decoder` is the answer to that one, and the platform lends
# what it already has.
image-io = ["dep:image"]
# Loading weights from a path, for `wxscan_scanner_new_path`. Only std::fs, so
# it costs a few hundred bytes rather than a decoder — but a browser has no
# filesystem to read, so the wasm build leaves it off with the rest of the
# defaults and does not carry a function that could only ever fail.
model-fs = []


[dependencies]
cvlite = "0.1.0"
wxscan = { path = "../wxscan", version = "0.1.0", default-features = false }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"], optional = true }

# webp, bmp and tiff, everywhere except Apple. Nobody photographs anything in
# these, but they arrive from elsewhere: webp off the web, bmp out of a Windows
# screenshot. They cost 570 KB, which is worth paying where there is no
# alternative and wasteful where there is — ImageIO reads all three already, and
# a browser decodes pictures itself and never compiles this crate's image-io at
# all. Written as a target dependency rather than a feature so that no caller
# has to remember which platform needs it.
[target.'cfg(not(any(target_os = "ios", target_os = "macos")))'.dependencies]
image = { version = "0.25", default-features = false, features = ["webp", "bmp", "tiff"], optional = true }

[build-dependencies]
cbindgen = "0.27"
