# Builds what a browser needs and publishes it, so that using wxscan in one
# does not require a Rust toolchain, an emsdk, or three quarters of an hour.
#
# The Dart package deliberately commits neither artifact: a compiled file
# sitting beside the sources it came from goes out of step with them, and one
# did — the live demo served a detector bug for a while after Rust had been
# fixed, because rebuilding it was a step someone had to remember.
#
# Two things are published, on two different rhythms.
#
#   * The scanner is this repository's own code. It is built on every push,
#     because that is when it changes, and it takes seconds.
#   * The TensorFlow Lite runtime is a dependency, pinned in
#     tools/tflite-wasm/tflite.toml. It is built only for a release, because it
#     is eight minutes of emscripten and it changes only when that file does.
#
# A tag is a version of this library — v0.1.0, not the version of anything it
# depends on — and its release carries everything a browser needs at that
# version, so that a consumer pins one tag rather than several.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { path: wxscan-rs }

      # cvlite and wxing are not on crates.io yet, so they are checked out
      # beside this one and patched in exactly as wxscan-dev/link.sh does on a
      # developer's machine. The compiler comes from rust-toolchain.toml, so
      # that is theirs too: what is published is what they would have built.
      - uses: actions/checkout@v4
        with: { repository: wilinz/cvlite, path: cvlite }
      - uses: actions/checkout@v4
        with: { repository: wilinz/wxing, path: wxing }

      - name: Build the scanner
        working-directory: wxscan-rs
        run: |
          mkdir -p .cargo
          printf '[patch.crates-io]\ncvlite = { path = "../cvlite" }\nwxing = { path = "../wxing" }\n' \
            > .cargo/config.toml
          rustup target add wasm32-unknown-unknown
          # Costs nothing in correctness and takes about 28% off scanning time.
          RUSTFLAGS="-C target-feature=+simd128" \
            cargo build -p wxscan-wasm --target wasm32-unknown-unknown --profile wasm
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/wasm32-unknown-unknown/wasm/wxscan_wasm.wasm "$GITHUB_WORKSPACE/out/"

      - name: Read the TensorFlow version
        id: tf
        working-directory: wxscan-rs
        run: |
          v=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' \
            tools/tflite-wasm/tflite.toml | head -1)
          [ -n "$v" ] || { echo "no version in tools/tflite-wasm/tflite.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: mymindstorm/setup-emsdk@v14
        if: github.ref_type == 'tag'
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      # The tree TensorFlow and its dependencies are fetched into. Restoring it
      # turns a rebuild into a few minutes; a miss builds from nothing, which
      # is what the first release does anyway.
      - uses: actions/cache@v4
        if: github.ref_type == 'tag'
        with:
          path: wxscan-rs/tools/tflite-wasm/.work
          key: tflite-${{ steps.tf.outputs.version }}-${{ hashFiles('wxscan-rs/tools/tflite-wasm/build.sh', 'wxscan-rs/tools/tflite-wasm/patches/*') }}
          restore-keys: tflite-${{ steps.tf.outputs.version }}-

      - name: Build the TensorFlow Lite runtime
        if: github.ref_type == 'tag'
        working-directory: wxscan-rs
        run: tools/tflite-wasm/build.sh "$GITHUB_WORKSPACE/out"

      # What these are, so that a file found on a disk months from now can be
      # traced back to what produced it.
      - name: Describe them
        working-directory: wxscan-rs
        run: |
          out="$GITHUB_WORKSPACE/out"
          {
            echo "repository=wilinz/wxscan-rs"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "rustc=$(rustc --version)"
            echo "rustflags=-C target-feature=+simd128"
            echo "sha256_scanner=$(sha256sum $out/wxscan_wasm.wasm | cut -d' ' -f1)"
            if [ -f "$out/wxscan_tflite.wasm" ]; then
              echo "tensorflow=${{ steps.tf.outputs.version }}"
              echo "emscripten=$(emcc --version | head -1)"
              echo "sha256_tflite_js=$(sha256sum $out/wxscan_tflite.js | cut -d' ' -f1)"
              echo "sha256_tflite_wasm=$(sha256sum $out/wxscan_tflite.wasm | cut -d' ' -f1)"
            fi
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$out/wxscan_web.build"
          cat "$out/wxscan_web.build"
          ls -l "$out"

      # For looking at a run that went wrong. Artifacts expire and releases do
      # not, so this is not where anyone should be fetching from.
      - uses: actions/upload-artifact@v4
        with:
          name: wxscan_web
          retention-days: 14
          path: out/*

      # A tag's release never moves and carries everything: it is what a
      # consumer pins. `wasm-latest` moves with main and carries only the
      # scanner — it is what the live demo tracks, and what someone following
      # development wants. A lock file should never name it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/out"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
              gh release create "$GITHUB_REF_NAME" --latest \
                --title "$GITHUB_REF_NAME" --generate-notes
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
          else
            gh release view wasm-latest >/dev/null 2>&1 || gh release create wasm-latest \
              --prerelease --title "wasm (latest main)" \
              --notes "The scanner as WebAssembly, rebuilt on every push to main.

          This tag moves. For bytes that stay put, and for the TensorFlow Lite
          runtime that goes with them, take a version release."
            gh release upload wasm-latest wxscan_wasm.wasm wxscan_web.build --clobber
          fi
