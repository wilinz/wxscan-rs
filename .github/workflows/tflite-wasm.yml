# Builds the TensorFlow Lite runtime for browsers and publishes it, so that
# nothing downstream has to commit a binary or own an emsdk.
#
# Kept apart from the `wasm` workflow because it is a different kind of thing.
# That one runs on every push and takes seconds; this clones TensorFlow, fetches
# a dozen dependencies and compiles about a thousand XNNPACK microkernels.
#
# So it runs on a tag and nothing else. `tflite-v2.17.1` builds TensorFlow
# v2.17.1 and publishes it as the release for that same tag — the artifact is
# anchored to a real ref, and the version is in the name because that, not a
# commit, is what identifies this thing. Editing the build script does not
# trigger it: a change worth publishing is worth tagging.
#
# workflow_dispatch stays for the case a tag's build fails, which would
# otherwise mean deleting the tag and pushing it again.
name: tflite-wasm

on:
  push:
    tags: ['tflite-v*']
  workflow_dispatch:
    inputs:
      version:
        description: TensorFlow version to build, e.g. v2.17.1
        required: true
        default: v2.17.1

permissions:
  contents: write

concurrency:
  group: tflite-wasm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # A tag says which version in its own name; a dispatch says so as an
      # input. The tag it will publish under is the tag it came from, so a
      # release cannot end up named for a version other than the one built.
      - name: Settle the version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#tflite-}"
          else
            version='${{ inputs.version }}'
            tag="tflite-$version"
          fi
          case "$version" in
            v*) ;;
            *) echo "expected a version like v2.17.1, got '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building TensorFlow $version, publishing as $tag"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      # The tree TensorFlow and its dependencies are fetched into. Restoring it
      # turns a rebuild from three quarters of an hour into a few minutes; a
      # miss simply builds from nothing, which is what the first run does.
      - uses: actions/cache@v4
        with:
          path: tools/tflite-wasm/.work
          key: tflite-wasm-${{ steps.v.outputs.version }}-${{ hashFiles('tools/tflite-wasm/build.sh', 'tools/tflite-wasm/patches/*') }}
          restore-keys: tflite-wasm-${{ steps.v.outputs.version }}-

      - name: Build
        env:
          TENSORFLOW_VERSION: ${{ steps.v.outputs.version }}
        run: tools/tflite-wasm/build.sh "$GITHUB_WORKSPACE/out"

      - name: Describe it
        run: |
          {
            echo "repository=wilinz/wxscan-rs"
            echo "commit=$GITHUB_SHA"
            echo "tensorflow=${{ steps.v.outputs.version }}"
            echo "emscripten=$(emcc --version | head -1)"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256_js=$(sha256sum out/wxscan_tflite.js | cut -d' ' -f1)"
            echo "sha256_wasm=$(sha256sum out/wxscan_tflite.wasm | cut -d' ' -f1)"
          } > out/wxscan_tflite.build
          cat out/wxscan_tflite.build
          ls -l out

      # Rebuilding the same version lands in the same place, and a different
      # version is a different artifact rather than a newer one.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease \
            --title "TensorFlow Lite for the browser, $TAG" \
            --notes "The TFLite C runtime with the XNNPACK delegate, compiled to WebAssembly by tools/tflite-wasm.

          This is the runtime a browser uses. It has to match what the package pins for every other platform; wxscan's tool/check_tflite_web.sh is what says so.

          \`wxscan_tflite.build\` names the TensorFlow version, the emscripten that built it, and the checksums."
          gh release upload "$TAG" \
            out/wxscan_tflite.js out/wxscan_tflite.wasm out/wxscan_tflite.build --clobber
