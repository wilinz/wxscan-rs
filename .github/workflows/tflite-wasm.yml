# Builds the TensorFlow Lite runtime for browsers and publishes it, so that
# nothing downstream has to commit a binary or own an emsdk.
#
# Kept apart from the `wasm` workflow because it is a different kind of thing.
# That one runs on every push and takes seconds; this clones TensorFlow, fetches
# a dozen dependencies and compiles about a thousand XNNPACK microkernels. It
# also barely ever changes, so it gets a release of its own that many versions
# of the scanner can point at, rather than a copy inside each of them.
#
# So it runs on a tag and nothing else. Editing the build script does not
# trigger it: a change worth publishing is worth tagging.
#
# What is built is not decided by the tag — it is decided by depversion.toml,
# which build.sh reads too, so a local build and this one cannot disagree. The
# tag has to name the same thing, and the run fails if it does not; that is a
# confirmation of what is being published, not a second place to say it.
#
# The tag names both halves, `tflite-v2.17.1-p1`, because both decide the
# bytes. Upstream does not build this configuration, so what comes out of a
# TensorFlow version depends on the patches in tools/tflite-wasm/patches and on
# the script that applies them as much as on the version — and those change
# while the version stays put. A tag carrying only the version would put two
# different runtimes under one name, and a checksum in a lock file downstream
# would be the only thing that noticed.
#
# There is deliberately no build cache. It would be keyed on exactly what the
# tag already names, it would be a near-miss away from restoring a tree that
# build.sh then declines to re-clone and re-patch, and this runs a few times a
# year. Ten honest minutes beats a fast answer that might be the old one.
#
# workflow_dispatch stays for the case a tag's build fails, which would
# otherwise mean deleting the tag and pushing it again.
name: tflite-wasm

on:
  push:
    tags: ['tflite-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tflite-wasm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # depversion.toml is the only source of both halves. A tag that names
      # something else is a mistake worth stopping for: it would publish bytes
      # under a name that does not describe them.
      - name: Settle the version
        id: v
        run: |
          key() {
            sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"\{0,1\}\([^\"]*\)\"\{0,1\}[[:space:]]*$/\1/p" \
              depversion.toml | head -1
          }
          version=$(key version)
          patch=$(key patch)
          [ -n "$version" ] || { echo "no [tensorflow] version in depversion.toml" >&2; exit 1; }
          [ -n "$patch" ] || { echo "no [tensorflow] patch in depversion.toml" >&2; exit 1; }
          tag="tflite-$version-p$patch"

          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "the tag is $GITHUB_REF_NAME, but depversion.toml says $tag." >&2
            echo "Tag $tag, or change depversion.toml first." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building TensorFlow $version at patch revision $patch, publishing as $tag"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build
        env:
          TENSORFLOW_VERSION: ${{ steps.v.outputs.version }}
        run: tools/tflite-wasm/build.sh "$GITHUB_WORKSPACE/out"

      - name: Describe it
        run: |
          {
            echo "repository=wilinz/wxscan-rs"
            echo "commit=$GITHUB_SHA"
            echo "tensorflow=${{ steps.v.outputs.version }}"
            echo "patch=${{ steps.v.outputs.patch }}"
            echo "emscripten=$(emcc --version | head -1)"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256_js=$(sha256sum out/wxscan_tflite.js | cut -d' ' -f1)"
            echo "sha256_wasm=$(sha256sum out/wxscan_tflite.wasm | cut -d' ' -f1)"
          } > out/wxscan_tflite.build
          cat out/wxscan_tflite.build
          ls -l out

      # Rebuilding the same tag lands in the same place, and a different
      # version or patch revision is a different artifact rather than a newer
      # one — which is the point of naming both in the tag.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease \
            --title "TensorFlow Lite for the browser, $TAG" \
            --notes "The TFLite C runtime with the XNNPACK delegate, compiled to WebAssembly by tools/tflite-wasm.

          This is the runtime a browser uses. It has to match what the package pins for every other platform; wxscan's tool/check_tflite_web.sh is what says so.

          The tag names the TensorFlow version and the revision of the patches built on top of it. Upstream does not build this configuration, so both decide the bytes.

          \`wxscan_tflite.build\` names them, the emscripten that compiled them, and the checksums."
          gh release upload "$TAG" \
            out/wxscan_tflite.js out/wxscan_tflite.wasm out/wxscan_tflite.build --clobber
